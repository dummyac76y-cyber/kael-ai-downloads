name: Publish verified Kael AI Remote v1.2.0 APK
on:
  push:
    paths:
      - '.github/workflows/publish-android-v1-2.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/publish-android-v1-2.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch verified binary artifact
        env:
          SOURCE_ZIP_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-7fe0-8207-9dd5-5396b2e46148/raw?se=2026-10-30T23%3A44%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=66192f96-108d-5cd6-a95f-fdd065502500&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-30T22%3A00%3A02Z&ske=2026-10-31T22%3A00%3A02Z&sks=b&skv=2026-02-06&sig=O3OLpFy3eYGdtRfzcKtSegzvPSGwwSTZ5TOO8sgNOjQ%3D'
        run: |
          set -euo pipefail
          curl --fail --location --show-error --silent --retry 3 --connect-timeout 20 -o artifact.zip "$SOURCE_ZIP_URL"
          unzip -p artifact.zip app-debug.apk > Kael-AI-Remote-v1.2.0.apk
          echo '514d88dfe10f3028829612e81204e3b1c20a0b425d6599107e3564ef7f6e3719  Kael-AI-Remote-v1.2.0.apk' | sha256sum --check -
          unzip -p Kael-AI-Remote-v1.2.0.apk assets/rustdesk.apk | sha256sum | grep '^dc37d05c0d382455e19cf9acc9dc89f7f8cf01264b2643fb4f71f6bb15bf9b4f'
          sha256sum Kael-AI-Remote-v1.2.0.apk > SHA256SUMS.txt
          echo 'RustDesk 1.5.0 Android ARM64 signed binary SHA-256: dc37d05c0d382455e19cf9acc9dc89f7f8cf01264b2643fb4f71f6bb15bf9b4f' > THIRD_PARTY_CHECKSUM.txt
          curl --fail --location --show-error --silent -o RustDesk-AGPL-3.0.txt https://www.gnu.org/licenses/agpl-3.0.txt
          cat > notes.md <<'NOTES'
          # Kael AI Remote v1.2.0 (Android)
          
          **One download** for the Kael AI Remote status companion and the unmodified, official RustDesk 1.5.0 Android ARM64 installer.
          
          - Device Status: view registered Desktop Commander device statuses using its authenticated dashboard
          - Remote Desktop: save a Windows RustDesk ID and open the RustDesk client to view and control your authorized Windows screen
          - On first use choose **Install included RustDesk**, approve Android's install-from-app permission and confirm the separate RustDesk installation
          - RustDesk must also be installed/configured on the Windows computer; Windows must be powered on and online
          - Kael AI doesn't contain remote passwords or bypass authentication
          - App is a debug-signed preview; older test builds may require uninstalling first
          
          **RustDesk credit and source:** unmodified RustDesk 1.5.0 from https://github.com/rustdesk/rustdesk/releases/tag/1.5.0 (AGPL-3.0); source code https://github.com/rustdesk/rustdesk/tree/1.5.0. See attached license and checksums. RustDesk is a separate app; this does not embed its viewer into Kael AI.
          
          **Android:** 7+; bundled RustDesk installer is ARM64 only.
          
          **Security:** verify SHA256SUMS.txt before installing; approve remote sessions only on devices you control.
          NOTES
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view android-v1.2.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload android-v1.2.0 Kael-AI-Remote-v1.2.0.apk SHA256SUMS.txt THIRD_PARTY_CHECKSUM.txt RustDesk-AGPL-3.0.txt --repo "${{ github.repository }}" --clobber
            gh release edit android-v1.2.0 --repo "${{ github.repository }}" --title "Kael AI Remote Android v1.2.0" --notes-file notes.md
          else
            gh release create android-v1.2.0 Kael-AI-Remote-v1.2.0.apk SHA256SUMS.txt THIRD_PARTY_CHECKSUM.txt RustDesk-AGPL-3.0.txt --repo "${{ github.repository }}" --target "${{ github.event.repository.default_branch }}" --title "Kael AI Remote Android v1.2.0" --notes-file notes.md --latest=false
          fi
      - name: Verify public APK asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view android-v1.2.0 --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -Fx Kael-AI-Remote-v1.2.0.apk
          curl --fail --location --silent --show-error -r 0-0 "https://github.com/${{ github.repository }}/releases/download/android-v1.2.0/Kael-AI-Remote-v1.2.0.apk" -o check-byte
          test -s check-byte
