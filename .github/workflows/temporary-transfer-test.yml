name: Temporary Kael installer transfer transport test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-transfer-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch signed transfer test file
        env:
          FILE_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-124c-8207-b1d4-a0b8a666410a/raw?se=2026-10-30T23%3A46%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=4c63d604-4239-5f66-a572-299bcbc5347c&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-30T21%3A48%3A28Z&ske=2026-10-31T21%3A48%3A28Z&sks=b&skv=2026-02-06&sig=zhjiJVc2xQXC4zznIOstjuXf2tpCVD/EzkTqXEAWiFg%3D"
        run: |
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 --output transfer.zip "$FILE_URL"
          echo "289b16a9703f3180758f1d0c0b1a67c51d86ca90ed6ca932fce93eba89b249d3  transfer.zip" | sha256sum --check
          unzip -t transfer.zip
