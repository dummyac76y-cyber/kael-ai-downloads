name: Publish Kael AI v2.0.2 installer
on:
  push:
    paths:
      - '.github/workflows/publish-v2.0.2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch verified Windows installer
        env:
          ARTIFACT_URL: 'https://sdmntprseasia.oaiusercontent.com/files/00000000-a660-8207-bd9a-849b0ed525b4/raw?se=2026-10-30T10%3A18%3A43Z&sp=r&sv=2026-02-06&sr=b&scid=b1fdc808-6b18-5c64-81bc-a060c62ba476&skoid=fb469448-2cc9-41bd-a5a6-6e020952b47a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-29T22%3A50%3A08Z&ske=2026-10-30T22%3A50%3A08Z&sks=b&skv=2026-02-06&sig=xzGP6aOvoa9qzwqJLSzsEitETEsULELzYj%2Bn%2BTjsOUg%3D'
        run: |
          set -euo pipefail
          curl -fLSs --retry 3 --connect-timeout 20 -o installer.zip "$ARTIFACT_URL"
          unzip -q installer.zip
          test -f Kael-AI-Chat-2.0.2-Windows-x64.exe
          echo 'a6bd34913fc64b7c368c6e9ab48c29d1c2706eb5b6e76875660a79e373420df1  Kael-AI-Chat-2.0.2-Windows-x64.exe' | sha256sum --check -
          sha256sum Kael-AI-Chat-2.0.2-Windows-x64.exe > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          # Kael AI Chat v2.0.2
          
          A chat-first Windows desktop app, replacing the earlier background launcher.
          
          - Modern chat interface, conversation history, and model selection
          - User-provided OpenRouter API key for free-tier cloud AI models
          - Optional Wikipedia and Brave Search lookups
          - Startup/recovery screen instead of a blank or black window
          - Custom Kael AI icon and Windows installer branding
          - Optional Desktop Commander controls under Advanced Settings
          
          **Windows:** 10 or 11, 64-bit.
          **Setup:** Install, open Kael AI, and add your OpenRouter API key in Settings. Free model availability and usage limits depend on OpenRouter.
          **Security:** Unsigned installer; Windows SmartScreen may show a warning.
          **Verification:** See SHA256SUMS.txt and compare with Get-FileHash in PowerShell.
          EOF
      - name: Create or update public GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view v2.0.2 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit v2.0.2 --repo "${{ github.repository }}" --notes-file release-notes.md --title "Kael AI Chat v2.0.2" --latest
            gh release upload v2.0.2 Kael-AI-Chat-2.0.2-Windows-x64.exe SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
          else
            gh release create v2.0.2 Kael-AI-Chat-2.0.2-Windows-x64.exe SHA256SUMS.txt --repo "${{ github.repository }}" --target "${{ github.event.repository.default_branch }}" --title "Kael AI Chat v2.0.2" --notes-file release-notes.md --latest
          fi

      - name: Record verified release only after public asset responds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view v2.0.2 --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -Fx Kael-AI-Chat-2.0.2-Windows-x64.exe
          curl -fIsSL --retry 2 "https://github.com/${{ github.repository }}/releases/download/v2.0.2/Kael-AI-Chat-2.0.2-Windows-x64.exe" >/dev/null
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          printf '\n<!-- v2.0.2 release asset HEAD verified by GitHub Actions; SHA256 a6bd34913fc64b7c368c6e9ab48c29d1c2706eb5b6e76875660a79e373420df1 -->\n' >> README.md
          git config user.name github-actions
          git config user.email github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "Confirm public v2.0.2 installer and checksum"
          git push
