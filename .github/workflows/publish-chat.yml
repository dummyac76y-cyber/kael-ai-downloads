name: Publish Kael AI Chat installer
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: Temporary compiled installer ZIP URL
        type: string
        required: true
      sha256:
        description: Expected installer SHA-256
        type: string
        required: true
      size:
        description: Expected installer byte size
        type: string
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download compiled installer
        env:
          INPUT_URL: ${{ inputs.artifact_url }}
        run: |
          curl --fail --location --retry 3 --connect-timeout 25 --max-time 450 --output artifact.zip "$INPUT_URL"
          unzip -Z1 artifact.zip
          mkdir extracted
          unzip -q artifact.zip -d extracted
          test -f extracted/Kael-AI-Chat-2.0.0-Windows-x64.exe
      - name: Verify installer
        env:
          EXPECTED_HASH: ${{ inputs.sha256 }}
          EXPECTED_SIZE: ${{ inputs.size }}
        run: |
          set -eu
          binary="extracted/Kael-AI-Chat-2.0.0-Windows-x64.exe"
          test "$(sha256sum "$binary" | cut -d ' ' -f 1)" = "$EXPECTED_HASH"
          test "$(stat -c%s "$binary")" = "$EXPECTED_SIZE"
          printf '%s  %s\n' "$EXPECTED_HASH" 'Kael-AI-Chat-2.0.0-Windows-x64.exe' > SHA256SUMS.txt
      - name: Publish binary-only release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > RELEASE.md <<'NOTES'
          ## Kael AI Chat for Windows — v2.0.0

          A redesigned desktop chatbot with a chat interface, conversation history, local chat storage, and a custom Windows app icon.

          Cloud AI uses free-tier OpenRouter models, including a compact Liquid model. The user supplies an OpenRouter API key and free requests are rate limited.

          Internet lookup is optional: Wikipedia without an extra key, or broader Brave Search with a user-supplied key.

          Any previously installed background connection is managed separately via Settings > Advanced connections. Kael AI Chat does not start a remote connection by default.

          Cloud models receive prompts you submit. This Windows installer is unsigned. The private application source code is not included in this release.
          NOTES
          binary=extracted/Kael-AI-Chat-2.0.0-Windows-x64.exe
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 "$binary" SHA256SUMS.txt --clobber
          else
            gh release create v2.0.0 "$binary" SHA256SUMS.txt --title "Kael AI Chat v2.0.0 — Windows" --notes-file RELEASE.md --prerelease
          fi
          gh release view v2.0.0 --json assets --jq '.assets[]|{name:.name,size:.size}'
