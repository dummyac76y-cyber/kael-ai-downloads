name: Build Signal Study IT2006 Android APK
on:
  push:
    branches:
      - 'build/signal-study-it2006-apk'
    paths:
      - 'signal-study-android/**'
      - '.github/workflows/build-signal-study-it2006-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check Android wrapper source
        run: python3 signal-study-android/validate_project.py
      - name: Build debug-signed APK
        run: gradle -p signal-study-android --no-daemon :app:assembleDebug
      - name: Verify signature and package
        run: |
          APK="signal-study-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.signalstudy.it2006'"
          cp "$APK" SignalStudy-IT2006-v1.0.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SignalStudy-IT2006-APK
          path: SignalStudy-IT2006-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
