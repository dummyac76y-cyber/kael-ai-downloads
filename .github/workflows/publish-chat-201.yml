name: Publish verified Kael AI Chat 2.0.1
on:
  push:
    branches: [main]
    paths: [transfer-201.json]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve installer-only build artifact
        run: |
          set -eu
          url="$(jq -r '.url' transfer-201.json)"
          test -n "$url"
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 450 --output artifact.zip "$url"
          mkdir extracted
          unzip -q artifact.zip -d extracted
          test -f extracted/Kael-AI-Chat-2.0.1-Windows-x64.exe
      - name: Require exact verified binary
        run: |
          set -eu
          binary=extracted/Kael-AI-Chat-2.0.1-Windows-x64.exe
          echo '41cee81cbacba047238452bfa5b43a3f1953cd4a9e26ae57b86d08e1c43027d4  extracted/Kael-AI-Chat-2.0.1-Windows-x64.exe' | sha256sum -c
          test "$(stat -c%s "$binary")" = "99429302"
          echo '41cee81cbacba047238452bfa5b43a3f1953cd4a9e26ae57b86d08e1c43027d4  Kael-AI-Chat-2.0.1-Windows-x64.exe' > SHA256SUMS.txt
      - name: Publish executable and checksum only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > notes.md <<'RELEASE_NOTES'
          ## Kael AI Chat v2.0.1 — Windows early preview

          A chat-first desktop experience with conversation history, a custom Windows icon, free-tier cloud models via OpenRouter, and optional web lookup.

          This update improves the first-run screen and adds a single action in Settings > Advanced connections that stops the old separately installed background launcher and disables its Windows autostart, after your confirmation.

          Getting started: install, open Kael AI Chat, and add your own OpenRouter API key in Settings. Free model access has daily rate limits. Wikipedia lookup works without a separate key; Brave Search requires your own API key.

          Cloud AI providers receive submitted prompts. The installer is unsigned and Windows may show a warning. The application source repository remains private.
          RELEASE_NOTES
          binary=extracted/Kael-AI-Chat-2.0.1-Windows-x64.exe
          gh release create v2.0.1 "$binary" SHA256SUMS.txt --title "Kael AI Chat v2.0.1 — Windows" --notes-file notes.md --prerelease
          gh release view v2.0.1 --json assets --jq '.assets[]|{name:.name,size:.size}'
