plugins {
    id 'com.android.application'
}

android {
    namespace 'ph.sti.studyatlas'
    compileSdk 35

    defaultConfig {
        applicationId 'ph.sti.studyatlas.reader'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    testImplementation 'junit:junit:4.13.2'
}
